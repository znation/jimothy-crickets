name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only the game's own images (public/); the concept art (~130 MB of LFS) isn't needed.
      - run: git lfs pull --include="public/**"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - name: Headless report (every level's reference must win)
        run: npm run sim -- --all --report > /dev/null
      - name: Difficulty curve
        run: npm run sim -- --all --curve
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
